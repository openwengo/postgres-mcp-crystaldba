services:
  postgres:
    build:
      context: ./tests
      dockerfile: Dockerfile.postgres-hypopg
      args:
        PG_VERSION: ${POSTGRES_VERSION:-15}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_mcp}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres_mcp}}
      DATABASE_CONNECTIONS: ${DATABASE_CONNECTIONS:-}
      MCP_ENABLE_OAUTH21: ${MCP_ENABLE_OAUTH21:-false}
      MCP_UNIFIED_AUTH: ${MCP_UNIFIED_AUTH:-false}
      EXTERNAL_OAUTH21_PROVIDER: ${EXTERNAL_OAUTH21_PROVIDER:-false}
      MCP_JWT_ISSUERS: ${MCP_JWT_ISSUERS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-}
      FASTMCP_SERVER_AUTH_GOOGLE_CLIENT_ID: ${FASTMCP_SERVER_AUTH_GOOGLE_CLIENT_ID:-}
      FASTMCP_SERVER_AUTH_GOOGLE_CLIENT_SECRET: ${FASTMCP_SERVER_AUTH_GOOGLE_CLIENT_SECRET:-}
      FASTMCP_SERVER_AUTH_GOOGLE_JWT_SIGNING_KEY: ${FASTMCP_SERVER_AUTH_GOOGLE_JWT_SIGNING_KEY:-}
      FASTMCP_SERVER_AUTH_GOOGLE_BASE_URL: ${FASTMCP_SERVER_AUTH_GOOGLE_BASE_URL:-}
      FASTMCP_SERVER_AUTH_JWT_PUBLIC_KEY: ${FASTMCP_SERVER_AUTH_JWT_PUBLIC_KEY:-}
      FASTMCP_SERVER_AUTH_JWT_JWKS_URI: ${FASTMCP_SERVER_AUTH_JWT_JWKS_URI:-}
      FASTMCP_SERVER_AUTH_JWT_ISSUER: ${FASTMCP_SERVER_AUTH_JWT_ISSUER:-}
      FASTMCP_SERVER_AUTH_JWT_AUDIENCE: ${FASTMCP_SERVER_AUTH_JWT_AUDIENCE:-}
      FASTMCP_SERVER_AUTH_JWT_ALGORITHM: ${FASTMCP_SERVER_AUTH_JWT_ALGORITHM:-}
      FASTMCP_SERVER_AUTH_JWT_REQUIRED_SCOPES: ${FASTMCP_SERVER_AUTH_JWT_REQUIRED_SCOPES:-}
      POSTGRES_MCP_BASE_URL: ${POSTGRES_MCP_BASE_URL:-}
      POSTGRES_MCP_EXTERNAL_URL: ${POSTGRES_MCP_EXTERNAL_URL:-}
      POSTGRES_MCP_OAUTH_PROXY_STORAGE_BACKEND: ${POSTGRES_MCP_OAUTH_PROXY_STORAGE_BACKEND:-memory}
      POSTGRES_MCP_OAUTH_PROXY_DISK_DIRECTORY: ${POSTGRES_MCP_OAUTH_PROXY_DISK_DIRECTORY:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_HOST: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_HOST:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_PORT: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_PORT:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_DB: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_DB:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_USE_TLS: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_USE_TLS:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_USERNAME: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_USERNAME:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_PASSWORD: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_PASSWORD:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_KEY_PREFIX: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_KEY_PREFIX:-postgres-mcp}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_REQUEST_TIMEOUT_MS: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_REQUEST_TIMEOUT_MS:-}
      POSTGRES_MCP_OAUTH_PROXY_VALKEY_CONNECTION_TIMEOUT_MS: ${POSTGRES_MCP_OAUTH_PROXY_VALKEY_CONNECTION_TIMEOUT_MS:-}
    command:
      - --access-mode=${POSTGRES_MCP_ACCESS_MODE:-unrestricted}
      - --transport=${POSTGRES_MCP_TRANSPORT:-sse}
      - --sse-port=8000
      - --streamable-http-port=8000
    ports:
      - "${POSTGRES_MCP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
