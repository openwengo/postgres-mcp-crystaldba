replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: crystaldba/postgres-mcp
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

containerPort: 8000

mcp:
  accessMode: restricted
  transport: sse
  bindHost: 0.0.0.0
  extraArgs: []

database:
  # Legacy single-connection source. Creates a generated Secret with DATABASE_URI
  # when set.
  uri: ""
  # Multi-connection source. Creates a generated Secret with DATABASE_CONNECTIONS
  # when set. The value must be the JSON string expected by the server.
  connections: ""
  # Legacy single-connection existing Secret. This Secret must contain
  # existingSecretKey, which defaults to DATABASE_URI.
  existingSecret: ""
  existingSecretKey: DATABASE_URI
  # Multi-connection existing Secret. This Secret must contain
  # existingConnectionsSecretKey, which defaults to DATABASE_CONNECTIONS.
  # Use this instead of existingSecret when your Secret has DATABASE_CONNECTIONS.
  existingConnectionsSecret: ""
  existingConnectionsSecretKey: DATABASE_CONNECTIONS
  secretNameOverride: ""

extraEnv: []
extraEnvFrom: []

service:
  type: ClusterIP
  port: 8000
  annotations: {}

ingresses: {}
# Example:
# ingresses:
#   public:
#     enabled: true
#     className: nginx
#     annotations: {}
#     hosts:
#       - host: postgres-mcp.example.com
#         paths:
#           - path: /
#             pathType: Prefix
#     tls: []
#   internal:
#     enabled: true
#     className: internal-nginx
#     annotations: {}
#     hosts:
#       - host: postgres-mcp.internal.example.com
#         paths:
#           - path: /
#             pathType: Prefix
#     tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30
