apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postgres-mcp.fullname" . }}
  labels:
    {{- include "postgres-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "postgres-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or (and (not .Values.database.existingSecret) .Values.database.uri) .Values.podAnnotations }}
      annotations:
        {{- if and (not .Values.database.existingSecret) .Values.database.uri }}
        checksum/database-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "postgres-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "postgres-mcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "postgres-mcp.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --access-mode={{ .Values.mcp.accessMode }}
            - --transport={{ .Values.mcp.transport }}
            {{- if eq .Values.mcp.transport "sse" }}
            - --sse-host={{ .Values.mcp.bindHost }}
            - --sse-port={{ .Values.containerPort }}
            {{- else if eq .Values.mcp.transport "streamable-http" }}
            - --streamable-http-host={{ .Values.mcp.bindHost }}
            - --streamable-http-port={{ .Values.containerPort }}
            {{- end }}
            {{- with .Values.mcp.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.database.existingSecret .Values.database.uri .Values.extraEnv }}
          env:
            {{- if or .Values.database.existingSecret .Values.database.uri }}
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres-mcp.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
