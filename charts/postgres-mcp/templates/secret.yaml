{{- if or (and (not .Values.database.existingSecret) .Values.database.uri) (and (not .Values.database.existingConnectionsSecret) .Values.database.connections) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres-mcp.generatedDatabaseSecretName" . }}
  labels:
    {{- include "postgres-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.database.existingSecret) .Values.database.uri }}
  DATABASE_URI: {{ .Values.database.uri | quote }}
  {{- end }}
  {{- if and (not .Values.database.existingConnectionsSecret) .Values.database.connections }}
  DATABASE_CONNECTIONS: {{ .Values.database.connections | quote }}
  {{- end }}
{{- end }}
