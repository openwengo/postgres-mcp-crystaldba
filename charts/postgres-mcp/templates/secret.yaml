{{- if and (not .Values.database.existingSecret) .Values.database.uri -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres-mcp.databaseSecretName" . }}
  labels:
    {{- include "postgres-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URI: {{ .Values.database.uri | quote }}
{{- end }}
